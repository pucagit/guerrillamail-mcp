[project]
name = "guerrillamail-mcp"
version = "0.1.0"
description = "Local stdio MCP server giving an AI structured access to GuerrillaMail disposable inboxes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
guerrillamail-mcp = "guerrillamail_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guerrillamail_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits the real GuerrillaMail API (deselected by default)",
]
addopts = "-m 'not live'"
